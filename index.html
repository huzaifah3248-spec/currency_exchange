<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
     integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <h1>Currency Exchange</h1>
        <p>Welcome to the Currency Exchange!</p>
        <form>
            <div class="amount">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" required>
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From Currency:</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png">
                    <label for="from-currency">From:</label>
                    <select id="from-currency" name="from-currency" required>
                        
                    </select>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to">
                    <p>To Currency:</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/PK/flat/64.png">
                    <label for="to-currency">To:</label>
                    <select id="to-currency" name="to-currency" required>
                       
                    </select>
                    </div>
                </div>
            </div>
            <div class="msg">True wealth is measured by the equity of our interactions, 
                not the fluctuations of the market.</div>
            <button type="submit">Convert</button>
        </form>
    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
    
</body>
</html>
